name: ZF Arcade and Animated Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "19 6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"
      - "scripts/render_gifs.py"
      - "scripts/render_animated_tools.py"
      - "scripts/tool_icons.json"
      - "assets/icons/**"

permissions:
  contents: write

concurrency:
  group: zf-profile-animation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout original GIF source
        uses: actions/checkout@v4

      - name: Setup Python for original GIF artwork
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render three original portfolio GIF animations
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/render_gifs.py dist

      - name: Install SVG renderer for real brand icons
        run: python -m pip install --disable-pip-version-check cairosvg

      - name: Render 29 animated real-logo tiles
        run: python scripts/render_animated_tools.py dist

      - name: Render animated contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: zuhayer03
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#6b42c8
            dist/snake-dark.svg?palette=github-dark&color_snake=#70e7ef&color_dots=#0b1125,#1c334b,#326b92,#8469ce,#c9a5ff

      - name: Render animated Pac-Man contribution arcade
        uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: zuhayer03
          games: "pacman"
          player_style: "opportunistic"

      - name: Verify all animations generated
        run: |
          for file in \
            dist/snake.svg \
            dist/snake-dark.svg \
            dist/pacman-contribution-graph.svg \
            dist/pacman-contribution-graph-dark.svg \
            dist/dev-console.gif \
            dist/tool-reel.gif \
            dist/build-pipeline.gif \
            dist/tool-cosmos.gif; do
              test -s "$file" || { echo "Missing animation: $file"; exit 1; }
              echo "OK: $file"
          done

      - name: Verify every real-brand tile was animated
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          items = json.loads(Path("scripts/tool_icons.json").read_text())["tools"]
          assert len(items) == 29
          for tool in items:
              asset = Path("dist/tool-animations") / (tool["id"] + ".gif")
              assert asset.is_file() and asset.stat().st_size > 1500, asset
              with Image.open(asset) as gif:
                  assert gif.n_frames >= 5, (asset, gif.n_frames)
          print(f"PASS: {len(items)} branded, animated GIF tiles")
          PY

      - name: Publish profile animations together
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
