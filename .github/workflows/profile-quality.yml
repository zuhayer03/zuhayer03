name: GitHub Profile Design Quality

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "assets/**"
      - ".github/workflows/profile-quality.yml"
  pull_request:
    paths:
      - "README.md"
      - "assets/**"
      - ".github/workflows/profile-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Verify profile art and tool icons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate illustrations and README references
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          import xml.etree.ElementTree as ET
          readme=Path("README.md").read_text(encoding="utf-8")
          local_refs=re.findall(r'<img[^>]+src="(assets/[^"]+)"',readme)
          assert local_refs, "No custom illustrations linked"
          for img in local_refs:
              file=Path(img)
              assert file.is_file(), f"Missing illustration: {img}"
              if file.suffix == ".svg":
                  ET.parse(file)
          # The clean visual redesign uses nine pre-rendered GIF cards rather
          # than 29 individual HTML tables. Their source manifest keeps every
          # original tool link available in the expandable directory.
          import json
          manifest=json.loads(Path("scripts/tool_icons.json").read_text(encoding="utf-8"))["tools"]
          assert len(manifest)==29 and len({tool["id"] for tool in manifest})==29
          cards=("core","coding","agents","infra","quality","design","practice","stack","pipeline")
          for card in cards:
              assert f"dashboard/{card}.gif" in readme, f"Missing animated dashboard card: {card}"
              assert f"dashboard/{card}.png" in readme, f"Missing reduced-motion fallback: {card}"
          assert readme.count('<td width="50%" valign="top">') >= 8, "Expected four two-column rows"
          assert '<td colspan="2" width="100%"' in readme, "Missing full-width pipeline"
          for item in manifest:
              assert f"[{item['name']}](" in readme, f"Missing direct tool link: {item['name']}"
          # Every original illustration stays visibly placed but its <img>
          # now loads a rendered motion GIF from the same repository's output
          # branch. The original SVG remains as a reduced-motion fallback.
          original_art = {
              "identity":"assets/identity.svg",
              "mission":"assets/current-mission.svg",
              "network-monitor":"assets/feature-network-monitor.svg",
              "finance-tracker":"assets/feature-finance-tracker.svg",
              "algoarena":"assets/feature-algoarena.svg",
              "threattrace":"assets/feature-threattrace.svg",
              "portfolio":"assets/portal-portfolio.svg",
              "lab":"assets/portal-lab.svg",
              "signoff":"assets/signoff.svg",
          }
          for key,source in original_art.items():
              assert f"/animated/{key}.gif" in readme, f"Missing original-art GIF: {key}"
              assert f'srcset="{source}"' in readme, f"Missing static fallback: {source}"
              assert Path(source).is_file(), f"Missing original SVG: {source}"
          assert len(re.findall(r"/animated/[a-z-]+\\.gif",readme)) == 9, "Expected exactly nine animated original-art images"
          icon_files=list(Path("assets/icons").glob("*.svg"))
          assert len(icon_files) >= 13, f"Missing self-hosted vector logos: {len(icon_files)}"
          for icon in icon_files:
              ET.parse(icon)
          for name in ("assets/identity.svg","assets/current-mission.svg","assets/tool-universe.svg","assets/stack-architect.svg","assets/contribution-constellation.svg"):
              assert Path(name).is_file(), f"Missing identity asset {name}"
          print(f"PASS: {len(local_refs)} original illustrations, 9 dashboard cards, 29 clickable tools, {len(icon_files)} vector logos")
          PY
