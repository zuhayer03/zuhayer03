<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="name description">
<title id="name">Zuhayer Alam Faiyaz — Software, systems and thoughtful design</title>
<desc id="description">An understated editorial developer masthead with warm ivory typography, soft sage accents, and an original layered sculptural Z monogram.</desc>
