<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="530" viewBox="0 0 1280 530" role="img" aria-labelledby="title subtitle">
<title id="title">Zuhayer Alam Faiyaz — developer identity</title><desc id="subtitle">A charcoal and luminous lime cinematic GitHub profile cover with orbital 3D sculpture and typography.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1111"/><stop offset=".59" stop-color="#141b19"/><stop offset="1" stop-color="#202b28"/></linearGradient>
 <linearGradient id="sculpt" x1=".15" y1=".15" x2=".9" y2="1"><stop stop-color="#fcffc2"/><stop offset=".26" stop-color="#dfff69"/><stop offset=".56" stop-color="#86ba70"/><stop offset=".84" stop-color="#2e655f"/><stop offset="1" stop-color="#163e3d"/></linearGradient>
 <linearGradient id="line" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#e6ff98"/><stop offset="1" stop-color="#a6f4de"/></linearGradient>
 <linearGradient id="peach" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd8b6"/><stop offset="1" stop-color="#e99c84"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#c5ff79" stop-opacity=".43"/><stop offset=".57" stop-color="#669a75" stop-opacity=".2"/><stop offset="1" stop-color="#407e6c" stop-opacity="0"/></radialGradient>
 <radialGradient id="inner"><stop stop-color="#071514"/><stop offset=".69" stop-color="#1d3530"/><stop offset="1" stop-color="#38554b"/></radialGradient>
 <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#e5ffaf" stroke-opacity=".07" stroke-width="1"/></pattern>
 <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="shadow"><feDropShadow dx="9" dy="23" stdDeviation="16" flood-color="#010b0a" flood-opacity=".8"/></filter>
 <clipPath id="rounded"><rect x="7" y="7" width="1266" height="516" rx="22"/></clipPath>
</defs>
<g clip-path="url(#rounded)">
<rect x="7" y="7" width="1266" height="516" fill="url(#bg)"/>
<rect x="7" y="7" width="1266" height="516" fill="url(#grid)"/>
<circle cx="985" cy="267" r="340" fill="url(#halo)"/>
<path d="M774 8V522" stroke="#8cab8d" stroke-opacity=".19"/>
<g font-family="Consolas,'Courier New',monospace">
  <rect x="39" y="36" width="145" height="33" rx="16" fill="#d9ff65"/><circle cx="58" cy="52" r="5" fill="#202822"><animate attributeName="opacity" values="1;.45;1" dur="2.8s" repeatCount="indefinite"/></circle>
  <text x="73" y="57" fill="#1d2a1d" font-size="12" font-weight="bold">Z · SYSTEM ONLINE</text>
  <text x="721" y="56" fill="#a7bca9" font-size="13" text-anchor="end" letter-spacing="1">IDENTITY / 001</text>
  <text x="45" y="142" fill="#d8ff72" font-size="18" letter-spacing="3">CREATIVE ENGINEERING  ↗</text>
</g>
<g font-family="Arial,Helvetica,sans-serif" font-weight="900">
  <text x="33" y="250" font-size="108" letter-spacing="-9" fill="#f5f5e9">ZUHAYER</text>
  <text x="33" y="346" font-size="93" letter-spacing="-8" fill="#f5f5e9">ALAM FAIYAZ</text>
</g>
<rect x="41" y="374" width="514" height="49" rx="24" fill="#d9ff65"/>
<text x="63" y="406" fill="#18241c" font-family="Consolas,monospace" font-size="23" font-weight="bold" letter-spacing="1">I MAKE IDEAS RUN. ✳</text>
<text x="46" y="482" fill="#c4d2c6" font-family="Consolas,monospace" font-size="14" letter-spacing="2">JAVA  /  PYTHON  /  DSA  /  AI AUTOMATION</text>
<!-- independent 3d-inspired luminous sculpture -->
<ellipse cx="988" cy="266" rx="178" ry="177" fill="#d2ff70" opacity=".32" filter="url(#soft)"/>
<ellipse cx="996" cy="263" rx="172" ry="173" fill="url(#sculpt)" filter="url(#shadow)"/>
<ellipse cx="996" cy="263" rx="109" ry="111" fill="url(#inner)" stroke="#a8f391" stroke-width="2"/>
<g fill="none" stroke="url(#line)">
 <ellipse cx="994" cy="268" rx="239" ry="83" stroke-width="3" transform="rotate(-31 994 268)" opacity=".89">
 <animateTransform attributeName="transform" type="rotate" values="-31 994 268;329 994 268" dur="68s" repeatCount="indefinite"/>
 </ellipse>
 <ellipse cx="994" cy="268" rx="239" ry="85" stroke-width="1.7" transform="rotate(61 994 268)" opacity=".44">
 <animateTransform attributeName="transform" type="rotate" values="61 994 268;421 994 268" dur="86s" repeatCount="indefinite"/>
 </ellipse>
 <circle cx="994" cy="268" r="220" stroke-dasharray="3 12" opacity=".28"/>
</g>
<text x="989" y="318" text-anchor="middle" fill="#e8ffc4" font-family="Arial,Helvetica,sans-serif" font-size="152" font-weight="900" letter-spacing="-17" filter="url(#shadow)">Z</text>
<g font-family="Consolas,monospace">
 <rect x="797" y="77" width="206" height="54" rx="13" fill="#e3d3f1" transform="rotate(-9 900 104)"/>
 <text x="817" y="101" font-size="13" fill="#30273b" transform="rotate(-9 900 104)">29 TOOLS / 07 DOMAINS</text>
 <text x="817" y="119" font-size="10" fill="#49375e" transform="rotate(-9 900 104)">AN EVOLVING WORKFLOW</text>
 <rect x="1012" y="412" width="223" height="63" rx="12" fill="url(#peach)" transform="rotate(6 1123 443)"/>
 <text x="1033" y="441" font-size="15" font-weight="bold" fill="#291e1a" transform="rotate(6 1123 443)">4 REAL BUILDS ↗</text>
 <text x="1034" y="460" font-size="10" fill="#513b32" transform="rotate(6 1123 443)">SOURCE + TESTS + DEMOS</text>
 <text x="805" y="499" fill="#a0c4aa" font-size="11" letter-spacing="1">PORTFOLIO / 2026</text>
